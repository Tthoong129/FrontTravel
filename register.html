<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Lang Thang</title>
    <link rel="stylesheet" href="css/core.css">
    <style>
        .register-bg {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 460px; /* Bề ngang cân đối, rộng rãi cho form nhiều trường */
            background: rgba(255, 255, 255, 0.75); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 30px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .auth-box-header { text-align: center; margin-bottom: 18px; }
        .auth-logo { display: inline-block; font-family: var(--font-heading); font-size: 26px; font-style: italic; color: var(--accent-color); margin-bottom: 4px; text-decoration: none; }
        .auth-title { font-family: var(--font-heading); font-size: 24px; color: var(--text-main); font-weight: 700; margin-bottom: 4px; }
        .auth-desc { color: var(--text-muted); font-size: 13px; }

        .input-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        .input-group label { font-size: 12px; font-weight: 700; color: var(--text-main); margin-bottom: 3px; }
        .input-group input { padding: 10px 14px; border: 1px solid rgba(24, 48, 24, 0.2); border-radius: 10px; background-color: rgba(255, 255, 255, 0.9); font-family: var(--font-body); font-size: 13px; outline: none; transition: all 0.3s; }
        .input-group input:focus { border-color: var(--text-main); background-color: #fff; box-shadow: 0 0 0 3px rgba(24, 48, 24, 0.08); }

        .auth-options { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 12px; }
        .remember-me { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 500; cursor: pointer; }
        .remember-me input { width: 14px; height: 14px; accent-color: var(--text-main); cursor: pointer; }
        .remember-me a { color: var(--text-main); font-weight: 700; text-decoration: none; }
        .remember-me a:hover { color: var(--accent-color); text-decoration: underline; }

        .btn-primary { width: 100%; padding: 12px; background-color: var(--text-main); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn-primary:hover { background-color: #264a26; }

        .auth-divider { display: flex; align-items: center; text-align: center; margin: 12px 0; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(24, 48, 24, 0.15); }
        .auth-divider span { padding: 0 10px; }

        .btn-google { width: 100%; padding: 11px; background-color: rgba(255, 255, 255, 0.9); color: var(--text-main); border: 1px solid rgba(24, 48, 24, 0.2); border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-bottom: 12px; }
        .btn-google:hover { background-color: #fff; border-color: var(--text-main); }

        .auth-redirect { text-align: center; font-size: 13px; color: var(--text-muted); margin: 0; }
        .auth-redirect a { color: var(--text-main); font-weight: 700; margin-left: 4px; text-decoration: none; }
        .auth-redirect a:hover { color: var(--accent-color); text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Ảnh nền gán qua style inline, sẵn sàng đón biến dynamic từ Backend -->
    <div class="register-bg" style="background-image: linear-gradient(rgba(10, 20, 10, 0.3), rgba(10, 20, 10, 0.5)), url('https://images.unsplash.com/photo-1528127269322-539801943592?q=80&w=1920&auto=format&fit=crop');">
        <div class="register-box">
            <div class="auth-box-header">
                <a href="index.html" class="auth-logo">LangThang</a>
                <h1 class="auth-title">Tạo tài khoản mới</h1>
                <p class="auth-desc">Tham gia cộng đồng yêu xê dịch Lang Thang.</p>
            </div>

            <form class="auth-form" action="index.html" method="POST">
                <!-- 1. Họ và tên -->
                <div class="input-group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên đầy đủ" required>
                </div>

                <!-- 2. Tên đăng nhập -->
                <div class="input-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required>
                </div>

                <!-- 3. Email -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email" required>
                </div>

                <!-- 4. Mật khẩu -->
                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                </div>

                <!-- 5. Nhập lại mật khẩu -->
                <div class="input-group">
                    <label for="confirm-password">Nhập lại mật khẩu</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Nhập lại mật khẩu" required>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" required> Đồng ý với <a href="#">Điều khoản</a>
                    </label>
                </div>

                <button type="submit" class="btn-primary">Đăng ký tài khoản</button>
            </form>

            <div class="auth-divider">
                <span>HOẶC ĐĂNG KÝ BẰNG</span>
            </div>

            <button class="btn-google">Tiếp tục với Google</button>

            <p class="auth-redirect">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </p>
        </div>
    </div>
</body>
</html>
